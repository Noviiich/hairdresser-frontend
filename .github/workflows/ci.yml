name: CI and GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated checks, but let an active production deployment finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # This project has no npm dependencies or lockfile; installation is unnecessary.
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Optional bootstrap token; normal deployments use the built-in token.
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Set Actions as the publishing source when bootstrapping
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [[ -n "$GH_TOKEN" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              --field build_type=workflow --silent
          fi

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
